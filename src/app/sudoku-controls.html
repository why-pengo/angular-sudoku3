<div class="sudoku-controls">
  @if (isGameComplete()) {
    <div class="sudoku-controls__complete" role="status">
      <mat-icon>celebration</mat-icon>
      <span>Puzzle Complete!</span>
    </div>
  } @else {
    <mat-button-toggle-group
      class="sudoku-controls__mode"
      aria-label="Entry mode"
      hideSingleSelectionIndicator
      [value]="isPencilMode() ? 'pencil' : 'pen'"
      (change)="togglePencilMode()"
    >
      <mat-button-toggle value="pen">
        <mat-icon>edit</mat-icon>
        <span>Pen</span>
      </mat-button-toggle>
      <mat-button-toggle value="pencil">
        <mat-icon>create</mat-icon>
        <span>Pencil</span>
      </mat-button-toggle>
    </mat-button-toggle-group>
  }

  <div class="sudoku-controls__pad">
    @for (num of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track num) {
      <button
        matButton="tonal"
        class="sudoku-controls__key"
        [disabled]="!selectedCell()"
        (click)="onNumberClick(num)"
      >
        {{ num }}
      </button>
    }

    <button
      matButton="outlined"
      class="sudoku-controls__key sudoku-controls__key--clear"
      aria-label="Clear cell"
      matTooltip="Clear cell"
      [disabled]="!selectedCell()"
      (click)="onClearCell()"
    >
      <mat-icon>backspace</mat-icon>
    </button>
  </div>
</div>
